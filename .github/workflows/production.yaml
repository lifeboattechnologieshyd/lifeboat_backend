name: Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "postman/**"
      - "docs/**"
      - "bruno/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ secrets.PRODUCTION_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          ssh ${{ secrets.PRODUCTION_EC2_USER }}@${{ secrets.PRODUCTION_EC2_HOST }} << 'EOF'

          cd lifeboat-backend

          echo "Fetching latest code..."
          git fetch origin

          echo "Checking out main..."
          git checkout main

          echo "Pulling latest code..."
          git pull origin main

          echo "Creating Docker network..."
          docker network create lifeboat-network || true

          echo "Stopping existing Lifeboat backend..."
          docker compose \
            -p lifeboat \
            -f ./deploy/compose/docker-compose.yaml \
            --env-file .env \
            stop backend || true

          echo "Removing existing Lifeboat backend..."
          docker compose \
            -p lifeboat \
            -f ./deploy/compose/docker-compose.yaml \
            --env-file .env \
            rm -f backend || true

          echo "Building and starting Lifeboat backend..."
          docker compose \
            -p lifeboat \
            -f ./deploy/compose/docker-compose.yaml \
            --env-file .env \
            up -d --build --no-deps backend

          echo "Removing unused Docker images..."
          docker image prune -f

          echo "Checking backend status..."
          docker ps --filter "name=lifeboat-backend"

          echo "Deployment completed."

          EOF