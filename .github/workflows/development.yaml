name: Deploy Lifeboat Development

on:
  push:
    branches:
      - development

concurrency:
  group: deploy-lifeboat-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.LIFEBOAT_DEV_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H "${{ secrets.LIFEBOAT_DEV_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa \
            "${{ secrets.LIFEBOAT_DEV_EC2_USER }}@${{ secrets.LIFEBOAT_DEV_EC2_HOST }}" << 'EOF'

          set -e

          cd /home/ubuntu/lifeboat_backend

          git fetch origin
          git reset --hard origin/development
          git clean -fd

          docker network create lifeboat-network || true
          docker volume create lifeboat_pg_data || true

          docker compose \
            -p lifeboat-development \
            -f deploy/compose/docker-compose.yaml \
            --env-file .env.docker \
            up -d --build --remove-orphans postgres backend

          docker image prune -f

          echo "Lifeboat development deployment completed"

          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" \
            | grep lifeboat || true

          EOF